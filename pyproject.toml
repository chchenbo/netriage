[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netriage"
dynamic = ["version"]
description = "Field network triage: tells you what is wrong with a wired or wireless link, not just what is measurable."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "netriage contributors" }]
keywords = ["network", "wifi", "diagnostics", "triage", "linux", "lldp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/chchenbo/netriage"
Issues = "https://github.com/chchenbo/netriage/issues"

[project.scripts]
netriage = "netriage.cli:main"

[tool.setuptools]
packages = ["netriage"]

[tool.setuptools.dynamic]
version = { attr = "netriage.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
